<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- إعدادات تطبيق الويب وتسميته -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="سحابة">
  <title>سحابة</title>

  <!-- أيقونة التطبيق -->
  <link rel="apple-touch-icon" href="icon.jpg">
  <link rel="icon" type="image/jpeg" href="icon.jpg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #ffffff;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      overflow: hidden;
      touch-action: manipulation;
    }

    header {
      text-align: center;
      margin-top: 20px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 15px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .timer-container {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 6px solid #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }

    .timer-days {
      font-size: 64px;
      font-weight: bold;
      line-height: 1;
    }

    .timer-label {
      font-size: 16px;
      color: #94a3b8;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .timer-time {
      font-size: 18px;
      letter-spacing: 2px;
      color: #cbd5e1;
    }

    .action-container {
      width: 90%;
      max-width: 380px;
      text-align: center;
      margin-bottom: 10px;
    }

    .sos-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff6b6b, #ee5253);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(238, 82, 83, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }

    .sos-button:active {
      transform: scale(0.97);
    }

    .target-info {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 12px;
    }

    .target-info span {
      color: #34d399;
      font-weight: bold;
    }

    nav {
      width: 100%;
      background-color: #1e293b;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      position: sticky;
      bottom: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #94a3b8;
      text-decoration: none;
      font-size: 12px;
      gap: 4px;
    }

    .nav-item.active {
      color: #34d399;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <header>
    <h1>☁️ سحابة</h1>
    <p>أنت أقوى من رغبة تدوم دقائق.</p>
  </header>

  <div class="timer-container">
    <div class="timer-days">0</div>
    <div class="timer-label">يوم</div>
    <div class="timer-time" id="countdown">00 : 00 : 06</div>
  </div>

  <div class="action-container">
    <button class="sos-button" onclick="alert('تم تفعيل وضع المساعدة')">
      <span>🆘</span> أحتاج مساعدة الآن
    </button>
    <div class="target-info">الهدف القادم: <span>1 يوم</span> - متبقي 1 يوم</div>
  </div>

  <nav>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      دعمي
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      يومياتي
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
      إنجازاتي
    </a>
    <a href="#" class="nav-item">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
      مهامي
    </a>
    <a href="#" class="nav-item active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      الرئيسية
    </a>
  </nav>

</body>
</html>
