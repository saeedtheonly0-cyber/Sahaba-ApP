name: Build Sahaba IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Create WebKit App Project
        run: |
          mkdir -p Sahaba
          cat << 'EOF' > Sahaba/ViewController.swift
          import UIKit
          import WebKit

          class ViewController: UIViewController, WKUIDelegate {
              var webView: WKWebView!
              override func loadView() {
                  let webConfiguration = WKWebViewConfiguration()
                  webView = WKWebView(frame: .zero, configuration: webConfiguration)
                  webView.uiDelegate = self
                  view = webView
              }
              override func viewDidLoad() {
                  super.viewDidLoad()
                  if let myURL = URL(string: "https://shaba0.netlify.app") {
                      let myRequest = URLRequest(url: myURL)
                      webView.load(myRequest)
                  }
              }
          }
          EOF

      - name: Build Payload and Create IPA
        run: |
          mkdir -p Payload
          # تحويل المشروع إلى IPA تلقائي
          zip -r Sahaba.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v3
        with:
          name: Sahaba-IPA
          path: Sahaba.ipa
