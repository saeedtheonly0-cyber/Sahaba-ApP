<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <!-- ضبط أبعاد الشاشة لمنع التكبير ومنع التداخل مع شريط الآيفون -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- إعدادات تجعل الصفحة تفتح كتطبيق كامل الشاشة (PWA/IPA Wrapper) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <title>سحابة</title>

  <style>
    /* إعادة ضبط القياسات الأساسية */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a; /* اللون الداكن للحديث */
      color: #ffffff;
      height: 100vh;
      height: 100dvh; /* لدعم الأبعاد الديناميكية في iOS */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: env(safe-area-inset-bottom, 20px);
      overflow: hidden;
      touch-action: manipulation;
    }

    /* رأس الصفحة */
    header {
      text-align: center;
      margin-top: 20px;
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    header p {
      font-size: 15px;
      color: #94a3b8;
      margin-top: 6px;
    }

    /* دائرة العداد الرئيسية */
    .timer-container {
      position: relative;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      border: 6px solid #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
    }

    .timer-days {
      font-size: 64px;
      font-weight: bold;
      line-height: 1;
    }

    .timer-label {
      font-size: 16px;
      color: #94a3b8;
      margin-top: 4px;
      margin-bottom: 12px;
    }

    .timer-time {
      font-size: 18px;
      letter-spacing: 2px;
      color: #cbd5e1;
    }

    /* زر أستنجد / المساعدة */
    .action-container {
      width: 90%;
      max-width: 380px;
      text-align: center;
    }

