name: Build Sahaba IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build WebKit App Payload
        run: |
          mkdir -p Payload/Sahaba.app
          
          # إنشاء ملف Info.plist المتوافق مع iOS
          cat << 'EOF' > Payload/Sahaba.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.doltk.sahaba</string>
              <key>CFBundleName</key>
              <string>Sahaba</string>
              <key>CFBundleDisplayName</key>
              <string>سحابة</string>
              <key>CFBundleExecutable</key>
              <string>Sahaba</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # كتابة وتجميع الكود التنفيذي بسيط
          cat << 'EOF' > main.m
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, @"AppDelegate");
              }
          }

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              UIViewController *vc = [[UIViewController alloc] init];
              WKWebView *webView = [[WKWebView alloc] initWithFrame:vc.view.bounds];
              [webView loadRequest:[NSURLRequest requestWithURL:[NSURL URLWithString:@"https://shaba0.netlify.app"]]];
              vc.view = webView;
              self.window.rootViewController = vc;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end
          EOF

          # تجميع الكود بنجاح لنظام iOS
          clang -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -arch arm64 -miphoneos-version-min=15.0 -fobjc-arc -framework UIKit -framework WebKit main.m -o Payload/Sahaba.app/Sahaba

          # ضغط الحزمة إلى IPA
          zip -r Sahaba.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahaba-IPA
          path: Sahaba.ipa
