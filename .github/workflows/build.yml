name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App
        run: |
          cordova create SahabaApp com.sahaba.app Sahaba
          cd SahabaApp
          rm -rf www/*
          cp -R ../* www/ || true
          cordova platform add ios

      - name: Build iOS Executable Package
        run: |
          cd SahabaApp
          cordova build ios --emulator
          cd platforms/ios/build/emulator
          mkdir -p Payload
          cp -R Sahaba.app Payload/
          zip -r ../../../../Sahaba.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahaba-IPA
          path: Sahaba.ipa
