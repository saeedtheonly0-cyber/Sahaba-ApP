name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Prepare Web Directory
        run: |
          mkdir -p www
          # نقل ملفات المشروع إلى داخل مجلد www لتوافق Capacitor
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name 'www' -exec mv {} www/ \;

      - name: Install Dependencies & Init Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init Sahaba com.sahaba.app --web-dir www
          npx cap add ios

      - name: Build iOS App Unsigned
        run: |
          npx cap sync ios
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build archive -archivePath build/App.xcarchive
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r Sahaba.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahaba-IPA
          path: ios/App/Sahaba.ipa
