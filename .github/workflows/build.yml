name: Build Sahaba IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Create App Bundle Structure
        run: |
          mkdir -p Payload/Sahaba.app
          
          # إنشاء ملف معلومات التطبيق الأساسي
          cat << 'EOF' > Payload/Sahaba.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.doltk.sahaba</string>
              <key>CFBundleName</key>
              <string>Sahaba</string>
              <key>CFBundleDisplayName</key>
              <string>سحابة</string>
              <key>CFBundleExecutable</key>
              <string>Sahaba</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </plist>
          EOF

          # كتابة كود الشاشة وتوجيهها لرابط موقعك
          cat << 'EOF' > main.swift
          import UIKit
          import WebKit

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  let webView = WKWebView(frame: vc.view.bounds)
                  if let url = URL(string: "https://shaba0.netlify.app") {
                      webView.load(URLRequest(url: url))
                  }
                  vc.view.addSubview(webView)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          _ = UIApplicationMain(CommandLine.argc, CommandLine.argv, nil, NSStringFromClass(AppDelegate.self))
          EOF

          # تجميع التطبيق خصيصاً لأجهزة الآيفون
          swiftc -target arm64-apple-ios15.0 -sdk $(xcrun --sdk iphoneos --show-sdk-path) -emit-executable -o Payload/Sahaba.app/Sahaba main.swift -framework UIKit -framework WebKit

          # ضغط الملف بصيغة IPA النهائية
          zip -r Sahaba.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sahaba-IPA
          path: Sahaba.ipa
